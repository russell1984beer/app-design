<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plotwise prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--ground:#E3E9DF;--paper:#F6F8F3;--ink:#1E3436;--muted:#5B6E6C;--line:#CBD5C7;--contour:#9A6A3F;--hivis:#F0C419;--water:#3D7EA6;--leaf:#5E7F4E}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Archivo,system-ui,sans-serif;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 6px}
.brand{font-weight:800;font-stretch:118%;font-size:22px;letter-spacing:-.01em}
.proj{font-size:13px;color:var(--muted);text-align:right}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#mapWrap{flex:1;min-height:0;padding:0 8px}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#map *{vector-effect:non-scaling-stroke}
#map text{font-family:Archivo,system-ui,sans-serif;paint-order:stroke;stroke:#F6F8F3;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
#panel{background:var(--paper);border-radius:20px 20px 0 0;padding:16px 18px 18px;max-height:46vh;overflow:auto;box-shadow:0 -1px 0 var(--line)}
h2{font-size:19px;font-stretch:112%;font-weight:750;margin:0 0 4px}
.lead{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.45;max-width:60ch}
nav{display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 11px;font:inherit;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
nav button[aria-current=page]{color:var(--ink);font-weight:700}
nav button[aria-current=page] svg{background:var(--hivis);border-radius:8px}
nav svg{width:34px;height:24px;padding:2px 6px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;margin-bottom:12px;font-size:14px}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ink)}
.field output{font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0}
.stats div{background:#fff;padding:9px 12px}
.stats b{display:block;font-size:20px;font-stretch:110%;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0;line-height:1.35}
.check input{margin-top:2px;accent-color:var(--leaf);width:18px;height:18px}
.check small{display:block;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;padding:13px 16px;font-weight:700;font-size:15px;margin-top:12px;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:flex;background:#E4EAE0;border-radius:999px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 4px;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(30,52,54,.18)}
.readout{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.5}
.readout .big{font-size:26px;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px 7px 9px;font-size:13px;display:flex;gap:7px;align-items:center;cursor:pointer}
.chip i{width:14px;height:14px;border-radius:4px}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--hivis)}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.step{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:5px 0}
.step div{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.step b{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#E4EAE0;border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--ink);width:0}
.phases{list-style:none;padding:0;margin:10px 0 0;font-size:14px}
.phases li{padding:4px 0;color:var(--muted)}
.phases li.done{color:var(--ink)}.phases li.done::before{content:"✓ ";color:var(--leaf);font-weight:800}
.phases li.now{color:var(--ink);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:15px}
.line{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:3px 0;border-top:1px dashed #E1E7DD}
.line:first-of-type{border-top:0}
.line span:last-child{font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin:6px 0 2px}
.total b{font-size:24px;font-stretch:112%}
.note{font-size:12px;color:var(--muted);line-height:1.4}
.fi{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin-bottom:8px}
.fi input,.fi select{font-size:16px;color:var(--ink);padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;width:100%}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
.tools button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.tools button:disabled{opacity:.4;cursor:default}
.tools label{margin-left:auto;display:flex;gap:6px;align-items:center}
@media (min-width:820px){main{flex-direction:row}#mapWrap{padding:8px 16px}#panel{width:390px;max-height:none;border-radius:20px 0 0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">Plotwise</div>
  <div class="proj">Test property, whole plot</div>
</header>
<main>
  <div id="mapWrap"><svg id="map" viewBox="-2.4 -2.2 12.8 51" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Garden map"></svg></div>
  <section id="panel" aria-live="polite"></section>
</main>
<nav id="nav"></nav>

<script>
const W=7.0,GH=29.5,HD=8,H=43; // rear garden, house depth, whole plot
const HW=W-1.2; // house width (side passage on right)
const zg=(x,y)=>1.9-0.055*y+0.35*Math.exp(-((x-5)**2+(y-12)**2)/10)-0.25*Math.exp(-((x-2.5)**2+(y-20)**2)/5)+(y>GH-6?0.055*(y-(GH-6)):0);
const z=(x,y)=>y<=GH?zg(x,y):y<=GH+HD?zg(x,GH):zg(x,GH)-0.11*(y-GH-HD);
const inHouse=p=>p.x<=HW&&p.y>=GH&&p.y<=GH+HD;
const fmt=v=>(v>=0?"+":"−")+Math.abs(v).toFixed(2);
const DATUM=z(3,GH); // patio door threshold
const lvl=(x,y)=>z(x,y)-DATUM;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const svg=$('#map'),panel=$('#panel');
const S={undo:[],redo:[],snap:true,drawing:null,vsel:null,dmode:'layout',month:'jun',time:15,hours:false,style:null,styleNote:'',existInit:false,roof:{phase:'idle',t:0,sel:null},tab:'plan',alt:20,ov:75,rtk:true,scanned:false,scan:{phase:'idle',t:0,step:0},layer:'contours',tool:'dist',pts:[],closed:false,items:[],placing:null,sel:null,nextId:1,checks:[false,true,false,true]};
let drag=null;

const KINDS={
  patio:{label:'Patio',w:4.2,h:3.6,fill:'#CFC6B3',stroke:'#7D7462'},
  lawn:{label:'Lawn',w:6,h:5,fill:'#9CC077',stroke:'#5E7F4E'},
  bed:{label:'Planting bed',w:3,h:1.2,fill:'#86644A',stroke:'#4F3826'},
  raised:{label:'Raised bed',w:2.4,h:1.2,fill:'#8A6A4C',stroke:'#5A3F28'},
  path:{label:'Gravel path',w:1,h:6,fill:'#DCD4C0',stroke:'#9C927B'},
  deck:{label:'Decking',w:4,h:3,fill:'#B88B5E',stroke:'#7A5733'},
  pond:{label:'Pond',w:2.4,h:1.6,fill:'#5D97BC',stroke:'#2F6688'},
  meadow:{label:'Wildflower meadow',w:5,h:4,fill:'#C3CC86',stroke:'#7E8C45'},
  shed:{label:'Shed',w:2.4,h:1.8,fill:'#7D8A80',stroke:'#4C5750'},
  tree:{label:'Tree',w:3.2,h:3.2,fill:'#5C8A50',stroke:'#2F4D2A'},
  greenhouse:{label:'Greenhouse',w:2.2,h:3,fill:'#DCE6E4',stroke:'#7E9296'},
  hottub:{label:'Hot tub',w:2.1,h:2.1,fill:'#4B6670',stroke:'#2E3F45'}
};
const MAT={
 patio:[['porcelain','Porcelain slabs','#D7D3CB',38],['sandstone','Indian sandstone','#D9C7A3',30],['block','Block paving','#B98F7A',28],['brick','Reclaimed brick','#B4624A',45]],
 path:[['gravel','Gravel','#DCD4C0'],['bark','Bark chips','#8A6444'],['stepping','Stepping stones in gravel','#C9C2B0']],
 deck:[['composite','Composite boards','#7F7468',95],['softwood','Treated softwood','#C79E6E',45],['hardwood','Hardwood','#8E5B3A',120]],
 lawn:[['turf','Turf','#9CC077'],['seed','Grass seed','#B3CF8E'],['artificial','Artificial grass','#6FBF5A']],
 raised:[['sleeper','Timber sleepers','#8A6A4C'],['corten','Corten steel','#9A5B3A']],
 bed:[['steel','Steel edging','#86644A'],['timber','Timber edging','#86644A'],['none','No edging','#86644A']],
 shed:[['timber','Timber','#7D8A80'],['metal','Metal','#9AA3A6']]
};
const matOf=it=>{const m=MAT[it.kind];return m?(m.find(x=>x[0]===it.mat)||m[0]):null};
const ROUND=k=>k==='tree'||k==='hottub';
const rotP=(x,y,a)=>{const c=Math.cos(a*Math.PI/180),s=Math.sin(a*Math.PI/180);return[x*c-y*s,x*s+y*c]};
function ctr(it){if(it.pts){let A=0,cx=0,cy=0;const P=it.pts;for(let i=0;i<P.length;i++){const[a,b]=P[i],[c,d]=P[(i+1)%P.length],f=a*d-c*b;A+=f;cx+=(a+c)*f;cy+=(b+d)*f}if(Math.abs(A)<1e-6)return[P[0][0],P[0][1]];return[cx/(3*A),cy/(3*A)]}return[it.x,it.y]}
function corners(it){if(it.pts)return it.pts;const a=it.a||0;return[[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx,sy])=>{const r=rotP(sx*it.w/2,sy*it.h/2,a);return[it.x+r[0],it.y+r[1]]})}
const localOf=(it,p)=>rotP(p.x-it.x,p.y-it.y,-(it.a||0));
function inRing(P,x,y){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[i],[d,e]=P[j];if((b>y)!==(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c}return c}
function inItem(it,x,y){if(it.pts)return inRing(it.pts,x,y);const l=localOf(it,{x,y});if(ROUND(it.kind)||it.kind==='pond')return(l[0]/(it.w/2))**2+(l[1]/(it.h/2))**2<=1;return Math.abs(l[0])<=it.w/2&&Math.abs(l[1])<=it.h/2}
const toXY=P=>P.map(p=>({x:p[0],y:p[1]}));
function itemArea(it){if(it.pts)return area(toXY(it.pts));if(it.kind==='pond'||ROUND(it.kind))return Math.PI*it.w*it.h/4;return it.w*it.h}
function itemPer(it){if(it.pts)return perim(toXY(it.pts));return 2*(it.w+it.h)}
function bbox(it){const P=it.pts||(ROUND(it.kind)?[[it.x-it.w/2,it.y-it.h/2],[it.x+it.w/2,it.y+it.h/2]]:corners(it));const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
const itemName=it=>it.label||(it.exist?'Existing '+KINDS[it.kind].label.toLowerCase():KINDS[it.kind].label);
const sn=v=>S.snap?Math.round(v*10)/10:v;
function pushUndo(){S.undo.push(JSON.stringify(S.items));if(S.undo.length>60)S.undo.shift();S.redo=[]}
function samplePts(it){const c=ctr(it),P=corners(it),k=Math.max(1,Math.floor(P.length/4)),o=[c];for(let i=0;i<P.length&&o.length<5;i+=k)o.push([(P[i][0]+c[0])/2,(P[i][1]+c[1])/2]);return o}
const PLANTS=[
 {id:'lav',name:'Lavender Hidcote',sun:'sun',sp:.45,col:'#8E7CC3',note:'Scented and loved by bees'},
 {id:'sal',name:'Salvia Caradonna',sun:'sun',sp:.4,col:'#5B4B9E',note:'Purple spikes all summer'},
 {id:'nep',name:"Catmint Walker's Low",sun:'sun',sp:.5,col:'#9AA6D8',note:'Tough, long flowering'},
 {id:'sti',name:'Mexican feather grass',sun:'sun',sp:.35,col:'#D8C98A',note:'Soft movement, drought tolerant'},
 {id:'ech',name:'Echinacea',sun:'sun',sp:.4,col:'#D77AA0',note:'Late summer colour'},
 {id:'ros',name:'Rosemary',sun:'sun',sp:.6,col:'#6E8F6A',note:'Evergreen herb'},
 {id:'ger',name:'Geranium Rozanne',sun:'part',sp:.5,col:'#6D7FD0',note:'Flowers June to October'},
 {id:'alc',name:"Lady's mantle",sun:'part',sp:.4,col:'#C8D36A',note:'Easy ground cover'},
 {id:'ast',name:'Astrantia',sun:'part',sp:.4,col:'#E6B8C8',note:'Good for cutting'},
 {id:'hyd',name:'Hydrangea Annabelle',sun:'part',sp:1,col:'#EDEFE0',note:'Big white flower heads'},
 {id:'ane',name:'Japanese anemone',sun:'part',sp:.5,col:'#F1C8D6',note:'Autumn flowers'},
 {id:'hos',name:'Hosta',sun:'shade',sp:.5,col:'#7FA36A',note:'Bold leaves'},
 {id:'fer',name:'Male fern',sun:'shade',sp:.6,col:'#5D8A4A',note:'Tough and low upkeep'},
 {id:'hel',name:'Hellebore',sun:'shade',sp:.45,col:'#B07A9A',note:'Winter flowers'},
 {id:'bru',name:'Brunnera Jack Frost',sun:'shade',sp:.4,col:'#9DB6D8',note:'Silver leaves, blue flowers'},
 {id:'sar',name:'Sweet box',sun:'shade',sp:.6,col:'#3F6B45',note:'Winter scent, evergreen'},
 {id:'tom',name:'Tomatoes',sun:'sun',sp:.5,col:'#D9533B',veg:1,note:'Needs a warm, sunny spot'},
 {id:'cou',name:'Courgettes',sun:'sun',sp:.9,col:'#E3C34A',veg:1,note:'Very productive'},
 {id:'her',name:'Mixed herbs',sun:'sun',sp:.3,col:'#7FA35A',veg:1,note:'Thyme, sage, parsley, chives'},
 {id:'sld',name:'Salad leaves',sun:'part',sp:.2,col:'#9CC36A',veg:1,note:'Copes with some shade'},
 {id:'chd',name:'Rainbow chard',sun:'part',sp:.3,col:'#C9506B',veg:1,note:'Crops for months'},
 {id:'rhu',name:'Rhubarb',sun:'shade',sp:.9,col:'#B5455A',veg:1,note:'Happy in shade'}
];
const PL=Object.fromEntries(PLANTS.map(p=>[p.id,p]));
const SUNLAB={sun:'Full sun',part:'Part shade',shade:'Shade'};
const STYLES={
 family:{label:'Family garden',desc:'Lawn for play, a patio, veg beds and a shed',items:[['patio',3.5,27.4,6.6,3.8],['lawn',3.8,17.5,4.6,11],['bed',.75,17.5,1.1,11],['path',6.6,14.5,.7,21],['raised',4.6,7,2.4,1.2],['raised',4.6,4.6,2.4,1.2],['shed',1.6,1.3,2.6,2]]},
 low:{label:'Low maintenance',desc:'Big patio, gravel and shrubs, with no lawn to mow',items:[['patio',3.5,26.9,6.6,4.8],['path',3.5,16,1,16],['bed',1.5,20,2.2,7],['bed',5.5,20,2.2,7],['bed',1.5,12,2.2,6],['bed',5.6,12,2,6],['deck',3.5,3.5,6,3.6]]},
 wildlife:{label:'Wildlife garden',desc:'A pond in the low spot, meadow and native planting',items:[['patio',3.5,27.8,5,3],['pond',2.6,20.2,2.6,1.8],['meadow',3.5,12,6.6,8],['bed',4.9,21,1.6,4],['path',6.6,14,.7,18],['tree',5.5,3,3,3],['bed',1.6,3,2.6,3]]},
 party:{label:'Entertaining',desc:'A patio by the house and a deck down the garden for evenings outside',items:[['patio',3.5,27.2,6.6,4.4],['lawn',3.5,19,6.6,7],['deck',3.5,11.5,6,4],['bed',1.2,6,2,5],['bed',5.8,6,2,5],['shed',3.5,1.4,2.4,1.8]]}
};

/* ---------- terrain ---------- */
const f2=p=>p[0].toFixed(2)+' '+p[1].toFixed(2);
let CONT=null;
function contours(){
  if(CONT)return CONT;CONT=[];const s=0.4;
  for(let L=-1;L<2.8;L+=0.25){
    let d='';const lv=L+DATUM;
    for(let x=0;x<W-1e-6;x+=s)for(let y=0;y<H-1e-6;y+=s){
      const x2=Math.min(x+s,W),y2=Math.min(y+s,H);
      const p=[[x,y],[x2,y],[x2,y2],[x,y2]],v=p.map(q=>z(q[0],q[1])),pts=[];
      for(let k=0;k<4;k++){const a=v[k],b=v[(k+1)%4];if((a-lv)*(b-lv)<0){const t=(lv-a)/(b-a),P=p[k],Q=p[(k+1)%4];pts.push([P[0]+t*(Q[0]-P[0]),P[1]+t*(Q[1]-P[1])])}}
      if(pts.length>=2)d+=`M${f2(pts[0])}L${f2(pts[1])}`;
      if(pts.length===4)d+=`M${f2(pts[2])}L${f2(pts[3])}`;
    }
    CONT.push({L:Math.round(L*100)/100,d});
  }
  return CONT;
}
function slopePct(x,y){const e=.05;return Math.hypot((z(x+e,y)-z(x-e,y))/(2*e),(z(x,y+e)-z(x,y-e))/(2*e))*100}
const slopeColor=p=>p<4?'#D3E3C6':p<8?'#ECE09C':p<15?'#E9B46B':'#D8784C';
let SLOPE=null;
function slopeLayer(){
  if(SLOPE)return SLOPE;SLOPE='';
  for(let x=0;x<W;x+=1)for(let y=0;y<H;y+=1){const w=Math.min(1,W-x),h=Math.min(1,H-y);SLOPE+=`<rect x="${x}" y="${y}" width="${w+.02}" height="${h+.02}" fill="${slopeColor(slopePct(x+w/2,y+h/2))}"/>`}
  return SLOPE;
}

/* ---------- flight ---------- */
function flight(){
  const sp=S.alt*0.75*(1-S.ov/100),lanes=Math.ceil(H/sp)+1,step=S.alt*0.5*(1-S.ov/100);
  const per=Math.ceil((W+2)/step)+1,photos=lanes*per+24;
  const len=lanes*(W+2)+(lanes-1)*(H/(lanes-1));
  const mins=(len/2.5+150)/60,gsd=S.alt*0.027,acc=S.rtk?1.5:3+S.alt/15;
  const pts=[];for(let i=0;i<lanes;i++){const y=i*H/(lanes-1);pts.push(...(i%2?[[W+1,y],[-1,y]]:[[-1,y],[W+1,y]]))}
  return{lanes,photos,mins,gsd,acc,pts};
}
function along(pts,t){
  const segs=[];let tot=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(l);tot+=l}
  let d=t*tot,flown=[pts[0]];
  for(let i=0;i<segs.length;i++){if(d<=segs[i]){const r=d/segs[i];const p=[pts[i][0]+r*(pts[i+1][0]-pts[i][0]),pts[i][1]+r*(pts[i+1][1]-pts[i][1])];flown.push(p);return{p,flown}}d-=segs[i];flown.push(pts[i+1])}
  return{p:pts[pts.length-1],flown};
}

/* ---------- map layers ---------- */
const DEFS=`<defs>
<filter id="grass" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .32  0 0 0 0 .16  0 0 0 .7 0"/></filter>

function flightLayer(t){

function measureLayer(){

    const d=Math.hypot(P[1].x-P[0].x,P[1].y-P[0].y),mx=(P[0].x+P[1].x)/2,my=(P[0].y+P[1].y)/2;

  }
  if(S.tool==='area'&&P.length>1){
    o+=`<polygon points="${P.map(p=>p.x+','+p.y).join(' ')}" fill="${S.closed?'rgba(240,196,25,.35)':'none'}" stroke="var(--ink)" stroke-width="2.5" ${S.closed?'':'stroke-dasharray="5 3"'}/>`;
    if(S.closed){const c=P.reduce((a,p)=>({x:a.x+p.x/P.length,y:a.y+p.y/P.length}),{x:0,y:0});o+=`<text x="${c.x}" y="${c.y}" font-size="1.65" font-weight="800" text-anchor="middle" fill="var(--ink)">${area(P).toFixed(1)} m²</text>`}

  return o;

function itemShape(it,fill,ring,op){
  if(it.pts)return `<polygon points="${it.pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ')}" fill="${fill}" ${op||''} ${ring}/>`;
  const tr=`transform="translate(${it.x.toFixed(2)} ${it.y.toFixed(2)}) rotate(${it.a||0})"`;
  if(ROUND(it.kind)||it.kind==='pond')return `<ellipse ${tr} rx="${it.w/2}" ry="${it.h/2}" fill="${fill}" ${op||''} ${ring}/>`;
  return `<rect ${tr} x="${-it.w/2}" y="${-it.h/2}" width="${it.w}" height="${it.h}" rx=".12" fill="${fill}" ${op||''} ${ring}/>`;
}
function itemsLayer(){
  return S.items.map(it=>{
    const K=KINDS[it.kind],m=matOf(it),fill=m?m[2]:K.fill,sel=it.id===S.sel;
    const ring=sel?`stroke="var(--ink)" stroke-width="3" stroke-dasharray="6 3"`:it.exist?`stroke="${K.stroke}" stroke-width="1.5" stroke-dasharray="3 2"`:`stroke="${K.stroke}" stroke-width="1.5"`;
    let o=itemShape(it,fill,ring,it.kind==='tree'?`fill-opacity="${it.exist?.55:.85}"`:'');
    const tex=it.kind==='deck'?'deckP':it.kind==='meadow'?'meadowP':(it.kind==='path'&&(!m||m[0]!=='bark'))?'gravelP':null;
    if(tex)o+=itemShape(it,`url(#${tex})`,'stroke="none"','pointer-events="none"');
    if(it.kind==='tree')o+=`<circle cx="${it.x}" cy="${it.y}" r=".18" fill="${K.stroke}"/>`;
    if(it.kind==='hottub')o+=`<circle cx="${it.x}" cy="${it.y}" r="${Math.max(.1,it.w/2-.25)}" fill="#6FA3B5"/>`;
    if((it.kind==='shed'||it.kind==='greenhouse')&&!it.pts){const c=corners(it);o+=`<path d="M${c[0]}L${c[2]}M${c[1]}L${c[3]}" stroke="${K.stroke}" stroke-width="1" fill="none"/>`}
    if((it.kind==='bed'||it.kind==='raised')&&it.plants&&it.plants.length){const[x0,y0,x1,y1]=bbox(it);let k=0;for(let px=x0+.25;px<x1;px+=.45)for(let py=y0+.25;py<y1;py+=.45){if(!inItem(it,px,py))continue;const p=PL[it.plants[k++%it.plants.length]];o+=`<circle cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r=".18" fill="${p.col}" stroke="#2F3B2A" stroke-width=".5"/>`}}
    const[x0,y0,x1,y1]=bbox(it),c=ctr(it),fs=Math.min(1.15,Math.max(.65,Math.min(x1-x0,y1-y0)/3.5));
    const lab=it.pts?`${itemArea(it).toFixed(1)} m²`:ROUND(it.kind)?`${it.w.toFixed(1)} m across`:`${it.w.toFixed(1)} × ${it.h.toFixed(1)} m`;
    return `<g data-id="${it.id}" style="cursor:move">${o}<text x="${c[0]}" y="${c[1]-fs*.15}" font-size="${fs}" font-weight="700" text-anchor="middle" fill="var(--ink)">${itemName(it)}</text><text x="${c[0]}" y="${c[1]+fs*1.05}" font-size="${fs*.85}" text-anchor="middle" fill="var(--ink)">${lab}</text></g>`;
  }).join('')+handlesLayer()+drawLayer();
}
const sq=(x,y,on)=>`<rect x="${x-.3}" y="${y-.3}" width=".6" height=".6" fill="${on?'var(--hivis)':'#fff'}" stroke="var(--ink)" stroke-width="2"/>`;
function handlesLayer(){
  if(S.tab!=='design'||S.dmode!=='layout'||S.drawing)return'';const it=S.items.find(i=>i.id===S.sel);if(!it)return'';
  const Hh=(x,y,id,shape)=>`<g data-h="${id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r=".9" fill="transparent"/>${shape}</g>`;
  let o='';
  if(it.pts){
    it.pts.forEach((p,i)=>{const q=it.pts[(i+1)%it.pts.length],mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;o+=Hh(mx,my,'m'+i,`<circle cx="${mx}" cy="${my}" r=".28" fill="#fff" stroke="var(--ink)" stroke-width="1.5"/><path d="M${mx-.15} ${my}h.3M${mx} ${my-.15}v.3" stroke="var(--ink)" stroke-width="1.5"/>`)});
    it.pts.forEach((p,i)=>{o+=Hh(p[0],p[1],'v'+i,sq(p[0],p[1],S.vsel===i))});return o;
  }
  if(ROUND(it.kind)){const x=it.x+it.w/2;return Hh(x,it.y,'rs',sq(x,it.y))}
  const a=it.a||0,c=rotP(it.w/2,it.h/2,a),r=rotP(0,-it.h/2-1.3,a),t=rotP(0,-it.h/2,a);
  o+=`<line x1="${it.x+t[0]}" y1="${it.y+t[1]}" x2="${it.x+r[0]}" y2="${it.y+r[1]}" stroke="var(--ink)" stroke-width="1.5"/>`;
  o+=Hh(it.x+c[0],it.y+c[1],'rs',sq(it.x+c[0],it.y+c[1]));
  o+=Hh(it.x+r[0],it.y+r[1],'ro',`<circle cx="${it.x+r[0]}" cy="${it.y+r[1]}" r=".34" fill="var(--hivis)" stroke="var(--ink)" stroke-width="2"/>`);

function drawLayer(){

  return `<polyline points="${P.map(p=>p.join(',')).join(' ')}${P.length>2?' '+P[0].join(','):''}" fill="${P.length>2?'rgba(240,196,25,.3)':'none'}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 3"/>`+P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i?.25:.38}" fill="var(--hivis)" stroke="var(--ink)" stroke-width="2"/>`).join('');

function renderMap(){

  else{const sun=S.tab==='design'&&S.dmode==='sun';b=planBase()+(sun&&S.hours?hoursLayer():'')+itemsLayer()+(sun&&!S.hours?shadowLayer():'')+boundary()+dims()+northArrow()}

/* ---------- sun & shade ---------- */
const AZR=128,RAD=Math.PI/180,LAT=50.86;
const MONTHS=[['mar','March',79],['jun','June',172],['sep','September',265],['dec','December',355]];
const pv=az=>[Math.sin((az-AZR)*RAD),-Math.cos((az-AZR)*RAD)];
const compass=a=>['north','north-east','east','south-east','south','south-west','west','north-west'][Math.round((((a%360)+360)%360)/45)%8];
function sunPos(N,solar){const d=23.44*Math.sin(2*Math.PI*(284+N)/365)*RAD,h=15*(solar-12)*RAD,f=LAT*RAD;
 const se=Math.sin(f)*Math.sin(d)+Math.cos(f)*Math.cos(d)*Math.cos(h),el=Math.asin(se);
 let az=Math.acos(Math.max(-1,Math.min(1,(Math.sin(d)-se*Math.sin(f))/(Math.cos(el)*Math.cos(f)))))/RAD;if(h>0)az=360-az;return{el:el/RAD,az}}
const monthN=()=>MONTHS.find(m=>m[0]===S.month)[2];
const solarOf=(N,clock)=>clock-(N>85&&N<300?1:0)+.04;
const EXIST_TREES=[[3,4,3.2],[4.8,9.5,2.2],[2.4,13,2.8],[1.6,18.5,1.8]];
function ensureExisting(){if(S.existInit||!S.scanned)return;S.existInit=true;
 S.items.push({id:S.nextId++,kind:'patio',x:W/2,y:GH-3,w:W,h:6,a:0,mat:'sandstone',exist:true});
 S.items.push({id:S.nextId++,kind:'hottub',x:W-1.3,y:GH-1.3,w:2.1,h:2.1,a:0,exist:true});
 S.items.push({id:S.nextId++,kind:'greenhouse',x:W-1.7,y:GH-8.5,w:2.2,h:3,a:0,exist:true});
 EXIST_TREES.forEach(([x,y,w])=>S.items.push({id:S.nextId++,kind:'tree',x,y,w,h:w,a:0,exist:true}))}
function casters(){
 const R=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
 const c=[{P:R(0,GH,HW,HD),h:7},{P:R(-5.8,GH,5.8,HD),h:7},{P:R(W+1,GH,5.8,HD),h:7},{P:R(-.05,0,.1,GH),h:1.8},{P:R(W-.05,0,.1,GH),h:1.8},{P:R(0,-.05,W,.1),h:1.8}];
 S.items.forEach(i=>{if(i.kind==='shed')c.push({P:corners(i),h:2.3});if(i.kind==='greenhouse')c.push({P:corners(i),h:2.2})});return c;
}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const p of P){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}for(const p of P.slice().reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}return lo.slice(0,-1).concat(up.slice(0,-1))}
function shadows(sun){
 if(sun.el<=1)return null;const k=1/Math.tan(sun.el*RAD),d=pv(sun.az),v=[-d[0]*k,-d[1]*k];
 const polys=casters().map(c=>{const P=c.P;return hull(P.concat(P.map(p=>[p[0]+v[0]*c.h,p[1]+v[1]*c.h])))});
 const trees=S.items.filter(i=>i.kind==='tree').map(i=>({x:i.x+v[0]*4.5,y:i.y+v[1]*4.5,r:i.w/2}));
 return{polys,trees};
}
function inPoly(P,x,y){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];const c=(b[0]-a[0])*(y-a[1])-(b[1]-a[1])*(x-a[0]);if(c!==0){if(s&&Math.sign(c)!==s)return false;s=Math.sign(c)}}return true}
const shaded=(sh,x,y)=>sh.polys.some(P=>inPoly(P,x,y))||sh.trees.some(t=>Math.hypot(x-t.x,y-t.y)<t.r);
function daySteps(N){const st=[];for(let t=4;t<=21;t+=.5){const s=sunPos(N,t);if(s.el>=3)st.push(shadows(s))}return st}
function sunHoursAt(N,pts){let h=0;for(const sh of daySteps(N))h+=.5*pts.filter(p=>!shaded(sh,p[0],p[1])).length/pts.length;return h}
function bedSun(it){const pts=samplePts(it);const h=(sunHoursAt(172,pts)+sunHoursAt(265,pts))/2;return{h,cls:h>=6?'sun':h>=3?'part':'shade'}}
function suggest(it){const c=bedSun(it).cls,pool=PLANTS.filter(p=>it.kind==='raised'?p.veg:!p.veg);let g=pool.filter(p=>p.sun===c);if(!g.length)g=pool;return g.slice(0,3).map(p=>p.id)}
let HM={key:'',svg:''};
function hoursLayer(){
 const key=S.month+JSON.stringify(S.items.filter(i=>['tree','shed','greenhouse'].includes(i.kind)).map(i=>[i.x,i.y,i.w,i.h,i.a,i.pts]));if(HM.key===key)return HM.svg;
 const steps=daySteps(monthN());let o='';
 for(let x=0;x<W-.01;x+=.5)for(let y=0;y<GH-.01;y+=.5){let h=0;for(const sh of steps)if(!shaded(sh,x+.25,y+.25))h+=.5;o+=`<rect x="${x}" y="${y}" width=".52" height=".52" fill="${h>=6?'#F2CF5B':h>=3?'#C9DC9A':'#8FA7A0'}"/>`}
 HM={key,svg:`<g opacity=".85">${o}</g>`};return HM.svg;
}
function shadowLayer(){
 const N=monthN(),s=sunPos(N,solarOf(N,S.time)),sh=shadows(s);
 if(!sh)return `<rect x="0" y="0" width="${W}" height="${GH}" fill="#1E3436" opacity=".4"/>`;

const inG=p=>p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H;
function clamp(it){const[x0,y0,x1,y1]=bbox(it);let dx=0,dy=0;if(x0<0)dx=-x0;else if(x1>W)dx=W-x1;if(y0<0)dy=-y0;else if(y1>H)dy=H-y1;if(it.pts)it.pts=it.pts.map(p=>[p[0]+dx,p[1]+dy]);else{it.x+=dx;it.y+=dy}}
svg.addEventListener('pointerdown',e=>{
  if(S.tab==='roof'){const g=e.target.closest('[data-issue]');if(g&&S.roof.phase==='done'){S.roof.sel=+g.dataset.issue;renderMap();renderPanel()}return}
  if(!S.scanned)return;const p=toM(e);
  if(S.tab==='survey'){
    if(!inG(p))return;
    if(S.tool==='dist'){if(S.pts.length>=2)S.pts=[];S.pts.push({x:p.x,y:p.y})}
    else{if(S.closed){S.pts=[];S.closed=false}S.pts.push({x:p.x,y:p.y})}
    renderMap();renderPanel();
  }else if(S.tab==='design'){
    const pr={x:sn(p.x),y:sn(p.y)};
    if(S.drawing){if(!inG(p))return;S.drawing.pts.push([pr.x,pr.y]);renderMap();renderPanel();return}
    const h=e.target.closest('[data-h]'),g=e.target.closest('[data-id]'),cur=S.items.find(i=>i.id===S.sel);
    if(h&&cur){const id=h.dataset.h;drag={snap:JSON.stringify(S.items)};
      if(id[0]==='m'){pushUndo();drag.moved=true;const i=+id.slice(1),P=cur.pts[i],q=cur.pts[(i+1)%cur.pts.length];cur.pts.splice(i+1,0,[(P[0]+q[0])/2,(P[1]+q[1])/2]);drag.t='v';drag.i=i+1;S.vsel=i+1}
      else if(id[0]==='v'){drag.t='v';drag.i=+id.slice(1);S.vsel=drag.i}
      else drag.t=id;
      svg.setPointerCapture(e.pointerId);renderMap();renderPanel();return}
    if(S.placing){if(!inG(p)||inHouse(p))return;pushUndo();const K=KINDS[S.placing];const it={id:S.nextId++,kind:S.placing,x:pr.x,y:pr.y,w:K.w,h:K.h,a:0};clamp(it);if(it.kind==='bed'||it.kind==='raised')it.plants=suggest(it);S.items.push(it);S.sel=it.id;S.placing=null}
    else if(g){const it=S.items.find(i=>i.id===+g.dataset.id);if(S.sel!==it.id)S.vsel=null;S.sel=it.id;const c=ctr(it);drag={t:'move',dx:p.x-c[0],dy:p.y-c[1],c0:c,start:it.pts?it.pts.map(q=>q.slice()):null,snap:JSON.stringify(S.items)};svg.setPointerCapture(e.pointerId)}
    else{S.sel=null;S.vsel=null}
    renderMap();renderPanel();
  }
});
svg.addEventListener('pointermove',e=>{if(!drag)return;const it=S.items.find(i=>i.id===S.sel);if(!it)return;const p=toM(e);
  if(!drag.moved){S.undo.push(drag.snap);if(S.undo.length>60)S.undo.shift();S.redo=[];drag.moved=true}
  if(drag.t==='move'){const nx=sn(p.x-drag.dx),ny=sn(p.y-drag.dy);if(it.pts){const dx=nx-drag.c0[0],dy=ny-drag.c0[1];it.pts=drag.start.map(q=>[q[0]+dx,q[1]+dy])}else{it.x=nx;it.y=ny}clamp(it)}
  else if(drag.t==='rs'){if(ROUND(it.kind)){it.w=it.h=Math.max(.4,sn(2*Math.hypot(p.x-it.x,p.y-it.y)))}else{const l=localOf(it,p);it.w=Math.max(.3,sn(2*Math.abs(l[0])));it.h=Math.max(.3,sn(2*Math.abs(l[1])))}clamp(it)}
  else if(drag.t==='ro'){let a=Math.atan2(p.y-it.y,p.x-it.x)*180/Math.PI+90;if(S.snap)a=Math.round(a/5)*5;it.a=((a%360)+360)%360}
  else if(drag.t==='v'){it.pts[drag.i]=[Math.max(0,Math.min(W,sn(p.x))),Math.max(0,Math.min(H,sn(p.y)))]}
  renderMap()});
const endDrag=()=>{if(drag){drag=null;renderPanel()}};
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);

renderNav();renderPanel();renderMap();
</script>
